[project]
name = "stress"
version = "0.1.0"
description = "Match wearable heart-rate spikes with calendar meetings to rank which coworker stresses you most"
readme = "README.md"
authors = [
    { name = "andreasheige" }
]
requires-python = ">=3.12"
dependencies = [
    "fitdecode>=0.11.0",
    "garminconnect>=0.3.19",
    "icalendar>=7.3.0",
    "numpy>=2.5.4",
    "recurring-ical-events>=3.8.2",
    "requests>=2.34.2",
]

[project.scripts]
stress = "stress.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
